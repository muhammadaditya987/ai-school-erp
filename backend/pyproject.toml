[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "school-erp-backend"
version = "0.1.0"
description = "Multi-tenant AI School ERP API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "boto3>=1.36,<2.0",
    "celery[redis]>=5.4,<6.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "PyJWT>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.2,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
ai = [
    "chromadb>=0.6,<2.0",
    "fastembed>=0.7,<1.0",
    "langchain-chroma>=0.2,<2.0",
    "langchain-google-genai>=2.0,<5.0",
    "langchain-huggingface>=0.1,<2.0",
    "langchain-ollama>=0.2,<1.0",
    "langchain-openai>=0.3,<2.0",
    "langgraph>=0.3,<2.0",
    "llama-index-core>=0.12,<0.15",
]
mcp = ["mcp>=1.12,<2.0"]
dev = [
    "aiosqlite>=0.21,<1.0",
    "httpx>=0.28,<1.0",
    "moto[s3]>=5.0,<6.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
