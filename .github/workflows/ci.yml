name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --extra dev --extra ai --extra mcp --locked
      - run: uv run ruff check app tests alembic
      - run: uv run pytest
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-validation.db
      - run: uv run alembic check
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-validation.db

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          RABBITMQ_DEFAULT_PASS: ci-rabbit-password
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: school-erp-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: school-erp-frontend:ci
