services:
  - type: pserv
    name: school-erp-chroma
    runtime: image
    image:
      url: chromadb/chroma:1.0.20
    plan: starter
    disk:
      name: chroma-data
      mountPath: /chroma/chroma
      sizeGB: 10
    envVars:
      - key: IS_PERSISTENT
        value: "TRUE"

  - type: web
    name: school-erp-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    plan: starter
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: school-erp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: school-erp-redis
          type: keyvalue
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: openai
      - key: AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CHROMA_HOST
        fromService:
          name: school-erp-chroma
          type: pserv
          property: host
      - key: CHROMA_PORT
        value: "8000"

  - type: worker
    name: school-erp-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.worker:celery_app worker --loglevel=INFO --concurrency=2
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: school-erp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: school-erp-redis
          type: keyvalue
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CHROMA_HOST
        fromService:
          name: school-erp-chroma
          type: pserv
          property: host
      - key: CHROMA_PORT
        value: "8000"

  - type: web
    name: school-erp-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_INTERNAL_URL
        fromService:
          name: school-erp-api
          type: web
          property: hostport

databases:
  - name: school-erp-db
    plan: basic-256mb
    databaseName: school_erp
    user: school_erp

  - name: school-erp-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
